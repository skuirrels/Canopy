$kind: http-request
name: Read configured error feeds
method: GET
url: '{{baseUrl}}/api/factory/projects/{{projectId}}/intake/error-feeds'
order: 1000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('baseUrl')||!pm.variables.get('projectId')||!pm.variables.get('sourceId')||!pm.variables.get('candidateId'))throw new Error('Supply explicit isolated fixture mode and identities.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Catalogue readable',()=>pm.response.to.have.status(200));const d=pm.response.json();pm.test('Configured choices expose identity and limits',()=>{pm.expect(d.supported).to.eql(true);pm.expect(d.feeds.length).to.be.above(0);d.feeds.forEach(f=>{pm.expect(f.identity.sourceId).to.be.a('string');pm.expect(f.levels.length).to.be.above(0);pm.expect(f.maxAgeSeconds).to.be.above(0);pm.expect(f).not.to.have.property('path')})});
