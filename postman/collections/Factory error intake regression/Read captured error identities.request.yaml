$kind: http-request
name: Read captured error identities
method: GET
url: '{{baseUrl}}/api/factory/intake/candidates/{{candidateId}}'
order: 3000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('baseUrl')||!pm.variables.get('projectId')||!pm.variables.get('sourceId')||!pm.variables.get('candidateId'))throw new Error('Supply explicit isolated fixture mode and identities.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Candidate readable',()=>pm.response.to.have.status(200));const d=pm.response.json();const e=JSON.parse(d.preview.observation.signal.evidenceJson);pm.test('Original group and distinct event identities remain inspectable',()=>{pm.expect(e.kind).to.eql('applicationErrors');pm.expect(e.group.id).to.be.a('string');pm.expect(new Set(e.group.occurrences.map(x=>x.id)).size).to.eql(e.group.occurrences.length);pm.expect(d.errorFeedReceipts.length).to.be.above(0)});
