$kind: http-request
name: Read workspace before observation
method: GET
url: '{{baseUrl}}/api/workspace'
order: 1000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('projectId')) throw new Error('Supply explicit isolated fixtureMode and projectId.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Workspace readable',()=>pm.response.to.have.status(200));pm.collectionVariables.set('workspaceBefore',JSON.stringify(pm.response.json()));
