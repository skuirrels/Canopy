$kind: http-request
name: Read intake coverage
method: GET
url: '{{baseUrl}}/api/factory/projects/{{projectId}}/intake'
order: 1000
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('projectId')||!pm.variables.get('candidateId')||!pm.variables.get('sourceId')) throw new Error('Supply explicit isolated fixture variables.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Intake readable',()=>pm.response.to.have.status(200));const x=pm.response.json();pm.test('Sources and coverage explicit',()=>{pm.expect(x.sources).to.be.an('array');pm.expect(x.collections).to.be.an('array')});pm.collectionVariables.set('candidateCount',x.candidates.length);
