$kind: http-request
name: Reject stale collection
method: POST
url: '{{baseUrl}}/api/factory/intake/sources/{{sourceId}}/collections'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "requestId": "{{$guid}}",
      "expectedSourceRevision": -1
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('projectId')||!pm.variables.get('candidateId')||!pm.variables.get('sourceId')) throw new Error('Supply explicit isolated fixture variables.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Stale source blocks collection',()=>pm.response.to.have.status(409));
