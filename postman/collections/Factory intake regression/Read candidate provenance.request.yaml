$kind: http-request
name: Read candidate provenance
method: GET
url: '{{baseUrl}}/api/factory/intake/candidates/{{candidateId}}'
order: 2000
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('projectId')||!pm.variables.get('candidateId')||!pm.variables.get('sourceId')) throw new Error('Supply explicit isolated fixture variables.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Candidate readable',()=>pm.response.to.have.status(200));const x=pm.response.json();pm.test('Evidence and decisions retained',()=>{pm.expect(x.observations.length).to.be.above(0);pm.expect(x.decisions).to.be.an('array');JSON.parse(x.preview.observation.signal.evidenceJson)});pm.collectionVariables.set('candidateRevision',x.preview.candidate.revision);
