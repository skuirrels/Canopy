$kind: http-request
name: Read exact metric evidence
method: GET
url: '{{baseUrl}}/api/factory/intake/candidates/{{candidateId}}'
order: 3000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('baseUrl')||!pm.variables.get('projectId')||!pm.variables.get('sourceId')||!pm.variables.get('candidateId'))throw new Error('Supply explicit isolated fixture mode and identities.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Candidate readable',()=>pm.response.to.have.status(200));const d=pm.response.json(),e=JSON.parse(d.preview.observation.signal.evidenceJson);pm.test('Original quantities and policy stay exact',()=>{pm.expect(e.kind).to.eql('analytics');pm.expect(e.metric.value).to.be.a('string');pm.expect(e.metric.samples).to.be.a('string');pm.expect(e.rule.condition.threshold).to.be.a('string');pm.expect(d.analyticsReceipts.length).to.be.above(0)});
