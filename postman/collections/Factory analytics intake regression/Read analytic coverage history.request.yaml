$kind: http-request
name: Read analytic coverage history
method: GET
url: '{{baseUrl}}/api/factory/projects/{{projectId}}/intake'
order: 2000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('baseUrl')||!pm.variables.get('projectId')||!pm.variables.get('sourceId')||!pm.variables.get('candidateId'))throw new Error('Supply explicit isolated fixture mode and identities.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Intake readable',()=>pm.response.to.have.status(200));const d=pm.response.json();pm.test('Native coverage retains actual immutable report provenance',()=>{pm.expect(d.analyticsReceipts.length).to.be.above(0);d.analyticsReceipts.forEach(r=>{pm.expect(r.coverage.fileHash).to.match(/^[A-F0-9]{64}$/);pm.expect(r.coverage.reportHash).to.match(/^[A-F0-9]{64}$/);pm.expect(r.coverage.reportId).to.be.a('string')})});
