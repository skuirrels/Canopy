$kind: http-request
name: Reject stale approval
method: POST
url: '{{baseUrl}}/api/factory/deliveries/{{deliveryId}}/actions'
order: 5000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "requestId": "{{$guid}}",
      "expectedRevision": -1,
      "action": "approveMerge",
      "approvalNote": "Explicit stale approval regression"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated'||!pm.variables.get('projectId')||!pm.variables.get('runId')||!pm.variables.get('deliveryId')) throw new Error('Supply isolated fixtureMode, projectId, runId and deliveryId.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Stale approval rejected',()=>pm.response.to.have.status(409));
