$kind: http-request
method: PUT
url: '{{baseUrl}}/api/factory/tasks/{{taskId}}/criteria'
order: 5400
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"expectedRevision":{{revision}},"criteria":[{"id":"{{criterionId}}","description":"First","expectedResult":"","verificationMethod":""},{"id":"{{criterionId}}","description":"Second","expectedResult":"","verificationMethod":""}]}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Duplicate criterion IDs rejected',()=>pm.response.to.have.status(400));
