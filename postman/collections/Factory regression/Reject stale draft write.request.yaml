$kind: http-request
method: PUT
url: '{{baseUrl}}/api/factory/pipelines/{{pipelineId}}/draft'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"expectedRevision":-1,"expectedDraftRevision":{{draftRevision}},"name":"Stale","description":"","definition":{{definition}}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Stale revision rejected',()=>pm.response.to.have.status(409));
