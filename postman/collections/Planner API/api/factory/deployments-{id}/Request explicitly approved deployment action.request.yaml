$kind: http-request
name: Request explicitly approved deployment action
method: POST
url: '{{baseUrl}}/api/factory/deployments/{{deploymentId}}/actions'
order: 4000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"requestId":"{{$guid}}","expectedRevision":{{deploymentRevision}},"action":"{{deploymentAction}}","approvalNote":"{{deploymentApprovalNote}}"}
