$kind: http-example
name: 'Isolated native API fixture - Conflict'
request:
  url: '{{baseUrl}}/api/factory/tasks/:id/criteria'
  method: PUT
  body:
    type: json
    content: |-
      {
        "expectedRevision": -1,
        "criteria": []
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
    Cache-Control: no-store
  body:
    type: json
    content: |-
      {
        "type": "https://tools.ietf.org/html/rfc9110#section-15.5.10",
        "title": "This project changed since you loaded it. Your latest changes have not been saved. Refresh and try again.",
        "status": 409
      }
