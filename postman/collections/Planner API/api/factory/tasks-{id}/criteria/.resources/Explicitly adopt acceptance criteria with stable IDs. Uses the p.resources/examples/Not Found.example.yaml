$kind: http-example
name: 'Isolated native API fixture - Not Found'
request:
  url: '{{baseUrl}}/api/factory/tasks/:id/criteria'
  method: PUT
  body:
    type: json
    content: |-
      {
        "expectedRevision": 14,
        "criteria": [
          {
            "id": "be16cda1-3831-4b28-bc9b-431e796f72ae",
            "description": "Increment zero",
            "expectedResult": "increment(0) == 1",
            "verificationMethod": "Run verify.py and inspect assertion line 2",
            "needsClarification": false
          }
        ]
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/problem+json
    Cache-Control: no-store
  body:
    type: json
    content: |-
      {
        "type": "https://tools.ietf.org/html/rfc9110#section-15.5.5",
        "title": "Task not found.",
        "status": 404
      }
