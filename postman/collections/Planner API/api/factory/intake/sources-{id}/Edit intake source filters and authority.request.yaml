$kind: http-request
description: Optional configured intake. Collection success is distinct from unavailable coverage. Exact request retries never duplicate tasks. Filing requires current source evidence, an explicit verification rationale and backlog column; it grants no execution or acceptance authority.
url: "{{baseUrl}}/api/factory/intake/sources/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: '{{sourceId}}'
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "expectedRevision": {{projectRevision}},
      "expectedSourceRevision": {{sourceRevision}},
      "configuration": {{intakeConfiguration}}
    }
examples: ./.resources/Edit intake source filters and authority.resources/examples
