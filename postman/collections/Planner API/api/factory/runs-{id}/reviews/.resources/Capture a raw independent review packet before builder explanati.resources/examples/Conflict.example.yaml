$kind: http-example
name: 'Isolated native API fixture - Conflict'
request:
  url: '{{baseUrl}}/api/factory/runs/:id/reviews'
  method: POST
  body:
    type: json
    content: |-
      {
        "requestId": "83a39ba9-5aeb-4d5d-8a08-d0b056dd7454",
        "expectedRevision": -1,
        "expectedContext": "EFDAEE394E43E038024F8AA3632DCB272F96EDDD209DF7982DC03BF5F27B1C99",
        "reviewer": "Isolated API example reviewer"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "https://tools.ietf.org/html/rfc9110#section-15.5.10",
        "title": "This project changed since you loaded it. Your latest changes have not been saved. Refresh and try again.",
        "status": 409
      }
