$kind: http-example
name: 'Isolated native delivery fixture - Bad Request'
request:
  method: POST
  url: '{{baseUrl}}/api/factory/runs/{{runId}}/deliveries'
  body:
    type: json
    content: |-
      {
        "requestId": "b209a6a8-02d8-4403-aa64-43d2838f095c",
        "expectedRevision": 19,
        "branchName": "../invalid"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "https://tools.ietf.org/html/rfc9110#section-15.5.1",
        "title": "Use a valid explicit Git branch name.",
        "status": 400
      }
