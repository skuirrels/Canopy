$kind: http-example
name: 'Isolated native API fixture - Conflict'
request:
  url: '{{baseUrl}}/api/factory/runs/:id/qa'
  method: POST
  body:
    type: json
    content: |-
      {
        "requestId": "45c646df-18db-43d9-a256-4dc277ca982f",
        "expectedRevision": -1,
        "expectedContext": "8D23DB908B9B79D68CFBDD519499992FE34187D3FB3302674CAB13F93B0D87F9",
        "criterionId": "be16cda1-3831-4b28-bc9b-431e796f72ae",
        "verdict": "unverified",
        "reason": "Contract fixture: operator review has not yet established acceptance.",
        "evidence": []
      }
