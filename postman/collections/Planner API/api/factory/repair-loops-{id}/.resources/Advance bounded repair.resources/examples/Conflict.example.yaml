$kind: http-example
name: 'Isolated native repair fixture - Conflict'
request:
  method: POST
  url: '{{baseUrl}}/api/factory/repair-loops/{{loopId}}/advance'
  body:
    type: json
    content: |-
      {
        "requestId": "a19bf2aa-ebcd-4418-a534-760f154bed34",
        "expectedRevision": -1
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "https://tools.ietf.org/html/rfc9110#section-15.5.10",
        "title": "This project changed since you loaded it. Your latest changes have not been saved. Refresh and try again.",
        "status": 409
      }
