$kind: http-request
name: Reject invalid ownership
method: POST
url: '{{baseUrl}}/api/factory/runs/{{runId}}/repair-loops'
order: 6000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "requestId": "{{$guid}}",
      "expectedRevision": -1,
      "expectedContext": "{{context}}",
      "owner": "planning",
      "findingIds": [],
      "criterionIds": []
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if(pm.variables.get('fixtureMode')!=='isolated' || !pm.variables.get('runId') || !pm.variables.get('projectId') || !pm.variables.get('loopId')) throw new Error('Supply the isolated fixtureMode, runId, projectId and loopId.');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Invalid capture rejected',()=>pm.response.to.have.status(409));
