$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/items/{{childId}}'
order: 6400
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {{assignmentBody}}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const task=JSON.parse(pm.collectionVariables.get('assignmentTask'));
      const body=Object.fromEntries(['title','specJson','statusId','priority','startDate','dueDate'].map(key=>[key,task[key]]));
      body.expectedRevision=Number(pm.collectionVariables.get('revision'));
      body.dependencyIds=[pm.collectionVariables.get('parentId')];
      body.assigneeIds=[pm.collectionVariables.get('person1'),pm.collectionVariables.get('person2')];
      body.assigneeIds=[body.assigneeIds[0],body.assigneeIds[0]]; pm.collectionVariables.set('assignmentBody',JSON.stringify(body));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Duplicate assignments rejected',()=>pm.response.to.have.status(400));
