$kind: http-request
method: POST
url: '{{baseUrl}}/api/items/{{parentId}}/move'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"expectedRevision":{{staleRevision}},"parentId":null,"statusId":"{{statusId}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Stale writes return 409',()=>pm.response.to.have.status(409));
