$kind: http-request
method: POST
url: '{{baseUrl}}/api/items/{{parentId}}/move'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"expectedRevision":{{revision}},"parentId":"{{childId}}","statusId":"{{statusId}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Hierarchy cycles return 400',()=>pm.response.to.have.status(400));
