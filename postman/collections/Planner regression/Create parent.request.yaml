$kind: http-request
method: POST
url: '{{baseUrl}}/api/projects/{{projectId}}/items'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"expectedRevision":{{revision}},"title":"Parent","parentId":null,"statusId":"{{statusId}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const value = pm.response.json();
      if (value.projects) {
       const project = value.projects.find(p => p.id === pm.collectionVariables.get('projectId'));
       if (project) pm.collectionVariables.set('revision', String(project.revision));
      }
      pm.test('Parent created',()=>pm.response.to.have.status(200)); pm.collectionVariables.set('parentId', value.items.find(i=>i.projectId===pm.collectionVariables.get('projectId')&&i.title==='Parent').id);
