$kind: http-request
method: POST
url: '{{baseUrl}}/api/projects/{{projectId}}/items'
order: 9300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"expectedRevision":{{revision}},"title":"Second component","parentId":null,"statusId":"{{statusId}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Second component created',()=>pm.response.to.have.status(200));
      const value = pm.response.json();
      pm.collectionVariables.set('revision',String(value.projects.find(p=>p.id===pm.collectionVariables.get('projectId')).revision));
      pm.collectionVariables.set('secondId',value.items.find(i=>i.projectId===pm.collectionVariables.get('projectId')&&i.title==='Second component').id);
